<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="ChopRite data architecture: five source systems into raw, cleaned and analytical layers, then reports">
<rect width="1600" height="900" fill="#f4f6f3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55636c"/></marker></defs>
<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="64" font-weight="700" fill="#17232b">ChopRite Foods QSR analytics</text>
<text x="90" y="250" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" fill="#55636c">From five systems that disagree to one trusted model</text>
<rect x="90" y="330" width="250" height="56" rx="10" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110" y="367" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#17232b" text-anchor="start">LegacyPOS</text>
<rect x="90" y="400" width="250" height="56" rx="10" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110" y="437" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#17232b" text-anchor="start">Techserve POS</text>
<rect x="90" y="470" width="250" height="56" rx="10" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110" y="507" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#17232b" text-anchor="start">HRMS</text>
<rect x="90" y="540" width="250" height="56" rx="10" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110" y="577" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#17232b" text-anchor="start">Sage 300 ledger</text>
<rect x="90" y="610" width="250" height="56" rx="10" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110" y="647" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#17232b" text-anchor="start">CRM</text>
<text x="90" y="312" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#55636c" text-anchor="start">Five source systems</text>
<path d="M346 498.0H392" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="400.0" y="378.0" width="250.5" height="240" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="424.0" y="434.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b" text-anchor="start">Raw</text>
<text x="424.0" y="480.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">As exported,</text>
<text x="424.0" y="512.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">never edited</text>
<path d="M654.5 498.0H678.5" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="686.5" y="378.0" width="250.5" height="240" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="710.5" y="434.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b" text-anchor="start">Cleaned</text>
<text x="710.5" y="480.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">Flagged, not</text>
<text x="710.5" y="512.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">deleted; every</text>
<text x="710.5" y="544.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">rule logged</text>
<path d="M941.0 498.0H965.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="973.0" y="378.0" width="250.5" height="240" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="997.0" y="434.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b" text-anchor="start">Analytical</text>
<text x="997.0" y="480.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">Star schema</text>
<text x="997.0" y="512.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">and date table</text>
<path d="M1227.5 498.0H1251.5" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1259.5" y="378.0" width="250.5" height="240" rx="16" fill="#e2f0e7" stroke="#1e7348" stroke-width="3"/>
<text x="1283.5" y="434.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b" text-anchor="start">Reports</text>
<text x="1283.5" y="480.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">Excel and a</text>
<text x="1283.5" y="512.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">9-page</text>
<text x="1283.5" y="544.0" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#55636c" text-anchor="start">Power BI report</text>
<text x="90" y="760" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#55636c" text-anchor="start">Fictional 13-branch chain, Jan 2022 – Aug 2026, about 224,500 orders. Power Query, Power Pivot and DAX.</text>
</svg>