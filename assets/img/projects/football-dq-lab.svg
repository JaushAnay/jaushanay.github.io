<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Football DQ Lab pipeline: ingest, validate, detect, classify, track, resolve, report">
<rect width="1600" height="900" fill="#f4f6f3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55636c"/></marker></defs>
<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="64" font-weight="700" fill="#17232b">Football DQ Lab</text>
<text x="90" y="250" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" fill="#55636c">The life of a data-quality issue, from raw record to report</text>
<rect x="90.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="110.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Ingest</text>
<text x="110.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Load raw</text>
<text x="110.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">records into</text>
<text x="110.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">PostgreSQL</text>
<path d="M266.0 495.0H294.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="298.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="318.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Validate</text>
<text x="318.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Run the</text>
<text x="318.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">rules on</text>
<text x="318.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">every record</text>
<path d="M474.0 495.0H502.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="506.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="526.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Detect</text>
<text x="526.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Flag records</text>
<text x="526.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">that break</text>
<text x="526.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">a rule</text>
<path d="M682.0 495.0H710.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="714.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="734.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Classify</text>
<text x="734.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Label each</text>
<text x="734.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">issue's type</text>
<text x="734.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">and severity</text>
<path d="M890.0 495.0H918.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="922.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="942.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Track</text>
<text x="942.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Follow each</text>
<text x="942.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">issue over</text>
<text x="942.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">time</text>
<path d="M1098.0 495.0H1126.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1130.0" y="380" width="172.0" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="1150.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Resolve</text>
<text x="1150.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Fix it and</text>
<text x="1150.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">record what</text>
<text x="1150.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">changed</text>
<path d="M1306.0 495.0H1334.0" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1338.0" y="380" width="172.0" height="230" rx="16" fill="#e2f0e7" stroke="#1e7348" stroke-width="3"/>
<text x="1358.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Report</text>
<text x="1358.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">Show quality</text>
<text x="1358.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">across the</text>
<text x="1358.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="21" fill="#55636c">database</text><text x="90" y="700" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" fill="#55636c">Synthetic data: fictional clubs and people in real countries, about 22,000 players.</text>
</svg>