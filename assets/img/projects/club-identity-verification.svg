<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Club identity verification method: compare, source, weigh, variants, record">
<rect width="1600" height="900" fill="#0E2F3D"/>
<rect width="1600" height="14" fill="#7fd9ad"/><rect x="1180" width="420" height="14" fill="#A1CAC2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fd9ad"/></marker></defs>
<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="64" font-weight="700" fill="#D6EAED">Verifying club identities</text>
<text x="90" y="250" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" fill="#A9B9B8">How each team-identity decision is made and documented</text>
<rect x="90.0" y="380.0" width="255.2" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="114.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Compare</text>
<text x="114.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Several identifying</text>
<text x="114.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">attributes, not</text>
<text x="114.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">just the name</text>
<path d="M349.2 495.0H373.2" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="381.2" y="380.0" width="255.2" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="405.2" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Source</text>
<text x="405.2" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">FIFA, national</text>
<text x="405.2" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">associations and</text>
<text x="405.2" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">official club sites</text>
<path d="M640.4 495.0H664.4" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="672.4" y="380.0" width="255.2" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="696.4" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Weigh</text>
<text x="696.4" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Rank sources when</text>
<text x="696.4" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">they conflict, by</text>
<text x="696.4" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">authority and date</text>
<path d="M931.6 495.0H955.6" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="963.6" y="380.0" width="255.2" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="987.6" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Variants</text>
<text x="987.6" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Treat name and</text>
<text x="987.6" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">transliteration</text>
<text x="987.6" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">differences as leads</text>
<path d="M1222.8 495.0H1246.8" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="1254.8" y="380.0" width="255.2" height="230.0" rx="16" fill="#7fd9ad" fill-opacity="0.16" stroke="#7fd9ad" stroke-width="3"/>
<text x="1278.8" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#7fd9ad" text-anchor="start">Record</text>
<text x="1278.8" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">The decision,</text>
<text x="1278.8" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">its confidence</text>
<text x="1278.8" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">and its sources</text><text x="90" y="700" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9B9B8" text-anchor="start">Handles rebrands, relocations, licence transfers, and reserve or youth teams mistaken for first teams.</text>
</svg>