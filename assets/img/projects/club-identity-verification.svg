<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Club identity verification method: compare, source, weigh, variants, record">
<rect width="1600" height="900" fill="#f4f6f3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55636c"/></marker></defs>
<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="64" font-weight="700" fill="#17232b">Verifying club identities</text>
<text x="90" y="250" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" fill="#55636c">How each team-identity decision is made and documented</text>
<rect x="90.0" y="380" width="255.2" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="114.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Compare</text>
<text x="114.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">Several identifying</text>
<text x="114.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">attributes, not</text>
<text x="114.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">just the name</text>
<path d="M349.2 495.0H377.2" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="381.2" y="380" width="255.2" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="405.2" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Source</text>
<text x="405.2" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">FIFA, national</text>
<text x="405.2" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">associations and</text>
<text x="405.2" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">official club sites</text>
<path d="M640.4 495.0H668.4" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="672.4" y="380" width="255.2" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="696.4" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Weigh</text>
<text x="696.4" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">Rank sources when</text>
<text x="696.4" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">they conflict, by</text>
<text x="696.4" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">authority and date</text>
<path d="M931.6 495.0H959.6" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="963.6" y="380" width="255.2" height="230" rx="16" fill="#ffffff" stroke="#c9d2cc" stroke-width="2"/>
<text x="987.6" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Variants</text>
<text x="987.6" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">Treat name and</text>
<text x="987.6" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">transliteration</text>
<text x="987.6" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">differences as leads</text>
<path d="M1222.8 495.0H1250.8" stroke="#55636c" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1254.8" y="380" width="255.2" height="230" rx="16" fill="#e2f0e7" stroke="#1e7348" stroke-width="3"/>
<text x="1278.8" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#17232b">Record</text>
<text x="1278.8" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">The decision,</text>
<text x="1278.8" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">its confidence</text>
<text x="1278.8" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" fill="#55636c">and its sources</text><text x="90" y="700" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" fill="#55636c">Handles rebrands, relocations, licence transfers, and reserve or youth teams mistaken for first teams.</text>
</svg>