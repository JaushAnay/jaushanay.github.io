<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="64" font-weight="700" fill="#D6EAED">Nigerian election analytics</text>
<text x="90" y="250" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" fill="#A9B9B8">A Python data-quality system that tests its own checks</text>
<rect x="90.0" y="380.0" width="328.0" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="114.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Validate</text>
<text x="114.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">20 rules across</text>
<text x="114.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">six quality</text>
<text x="114.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">dimensions</text>
<path d="M422.0 495.0H446.0" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="454.0" y="380.0" width="328.0" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="478.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Clean</text>
<text x="478.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Correct only</text>
<text x="478.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">what is knowable;</text>
<text x="478.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">log every change</text>
<path d="M786.0 495.0H810.0" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="818.0" y="380.0" width="328.0" height="230.0" rx="16" fill="#143a4a" fill-opacity="1" stroke="#2b5a6a" stroke-width="2"/>
<text x="842.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#D6EAED" text-anchor="start">Analyse</text>
<text x="842.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Turnout, share,</text>
<text x="842.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">margins, swing</text>
<text x="842.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">2015–2023</text>
<path d="M1150.0 495.0H1174.0" stroke="#7fd9ad" stroke-width="3" marker-end="url(#a)"/>
<rect x="1182.0" y="380.0" width="328.0" height="230.0" rx="16" fill="#7fd9ad" fill-opacity="0.16" stroke="#7fd9ad" stroke-width="3"/>
<text x="1206.0" y="436" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#7fd9ad" text-anchor="start">Test</text>
<text x="1206.0" y="482" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">Rerun without</text>
<text x="1206.0" y="514" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">doubtful records;</text>
<text x="1206.0" y="546" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#A9B9B8" text-anchor="start">do results hold?</text><text x="90" y="700" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#A9B9B8" text-anchor="start">Synthetic results with fictional parties. Real reference data only: states, zones, LGA counts and INEC polling units.</text>
