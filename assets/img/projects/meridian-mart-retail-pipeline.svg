<text x="90" y="760" font-family="'Public Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#b9ab9e" text-anchor="start">Orchestrated by Airflow: extracts in parallel, then dbt build, then freshness and volume checks.</text>
