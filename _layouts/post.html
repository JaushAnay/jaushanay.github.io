---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    <p class="muted"><a href="{{ '/writing/' | relative_url }}">Writing</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    <p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.kind == "note" %}, short note{% endif %}</p>
  </header>
  <div class="prose prose-serif">
    {{ content }}
  </div>
  {% include closing-cta.html %}
</article>
