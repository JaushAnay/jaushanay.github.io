<div class="skills-grid">
{%- for g in site.data.skills -%}
<section class="skill-group t-{{ g.track }}">
<h3>{{ g.name }}</h3>
<h4>Skills</h4>
<ul class="skill-list">{%- for s in g.skills -%}<li>{{ s }}</li>{%- endfor -%}</ul>
<h4>Tools</h4>
<ul class="tool-chips">{%- for s in g.tools -%}<li>{{ s }}</li>{%- endfor -%}</ul>
</section>
{%- endfor -%}
</div>
