{% case include.status %}
  {% when "completed" %}<span class="status status-done"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></svg>Completed</span>
  {% when "ongoing" %}<span class="status status-done"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></svg>Ongoing professional work</span>
  {% else %}<span class="status status-progress"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" /><path d="M8 5v3.2l2 1.3" /></svg>In progress</span>
{% endcase %}
