# The four areas of work. "id" must match the tracks: list in each project file.
# The first track listed in a project sets its colour on the site.
- id: data-quality
  name: Data validation
  line: Finding, classifying and fixing what is wrong with data before anyone relies on it.
- id: analytics
  name: Data analysis
  line: Turning trusted data into answers, dashboards and recommendations people can act on.
- id: data-engineering
  name: Data engineering
  line: Pipelines and warehouses that move data reliably and test it automatically.
- id: ai-automation
  name: AI automation
  line: Workflows that connect tools through APIs, and AI output checked for accuracy.
