# Newest first. Keep work descriptions at the level of process and outcome.
- role: Data Validation Specialist (Contract)
  org: Sportmonks
  org_note: Global sports data provider
  place: Remote
  dates: Feb 2026 – present
  points:
    - Validate and maintain thousands of sports data records daily, covering fixtures, seasons, teams, players, referees, coaches and competitions, checking accuracy, completeness and consistency before data reaches customers.
    - Cover football competitions across Europe, South America, Africa, Asia and Oceania, including lower-tier and amateur leagues where reliable sources are limited.
    - Resolve complex identity cases such as mid-season club rebrands, relocations, licence transfers and reserve- or youth-team conflations, so separate entities are never merged and records stay correctly linked.
    - Verify information against FIFA, national football associations, official club websites, Transfermarkt, Flashscore and other sports databases, and weigh sources against each other when they conflict.
    - Apply a structured, multi-attribute verification approach, recording a confidence level and supporting sources for each decision.
    - Correct discrepancies, missing information, conflicting records and naming variations, including transliteration differences in player and referee names.
    - Map players, referees and coaches into match lineups, update squads, and create seasons and profiles in both calendar-year and cross-year formats.
    - Investigate customer data requests and respond with verified corrections or information.
    - Review AI-generated research for factual accuracy, relevance, completeness and instruction adherence before relying on it.
  case_study: /projects/club-identity-verification/
- role: Data Analysis and Visualization Intern
  org: Excelerate
  org_note: Virtual internship programme
  place: Remote
  dates: Mar 2026 – Apr 2026
  points:
    - Worked in a global team of interns across different backgrounds and time zones, collaborating remotely toward a shared goal.
    - Analysed a real-world, unstructured dataset through the full process of cleaning, interpreting and making sense of messy data.
    - Identified meaningful patterns and decided which information was relevant to the question and which was not.
    - Turned findings into clear visual stories, communicating insights in a way that was accessible and easy to understand.
